name: Publish Panel

on:
  push:
    branches: [main]
    paths:
      - crates/computer-panel/**
      - crates/computer-model/**

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: panel-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            panel-${{ runner.os }}-

      - name: Install Dioxus CLI
        run: |
          curl -fsSL https://dioxus.dev/install.sh | bash
          echo "$HOME/.dx/bin" >> "$GITHUB_PATH"

      - name: Build panel
        run: dx bundle --web --release -p computer-panel

      - name: Create archive
        run: |
          tar -czf panel.tar.gz \
            -C target/dx/computer-panel/release/web/public .

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          old=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')

          gh release create \
            "panel-${{ github.sha }}" \
            panel.tar.gz \
            --title "Panel ${{ github.sha }}" \
            --notes "Panel built from commit ${{ github.sha }}" \
            --latest

          if [ -n "$old" ]; then
            gh release delete "$old" --yes --cleanup-tag
          fi
