name: Publish Panel

on:
  push:
    branches: [main]
    paths:
      - crates/computer-panel/**
      - crates/computer-model/**

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: panel

      - uses: actions/configure-pages@v5

      - name: Install Dioxus CLI
        run: |
          curl -fsSL https://dioxus.dev/install.sh | bash
          echo "$HOME/.dx/bin" >> "$GITHUB_PATH"

      - name: Build and package panel
        run: |
          dx bundle --web --release -p computer-panel

          mkdir -p _site/panel

          tar -czf _site/panel/panel.tar.gz \
            -C target/dx/computer-panel/release/web/public .

          HASH=$(sha256sum _site/panel/panel.tar.gz | cut -d ' ' -f 1)

          cat > _site/panel/latest.json <<EOF
          {
            "version": "${GITHUB_SHA}",
            "file": "panel.tar.gz",
            "sha256": "${HASH}"
          }
          EOF

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
