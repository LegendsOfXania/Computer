[workspace]
resolver = "2"
members = [
    "crates/computer-model",
    "crates/computer-panel",
    "crates/mock-engine",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
kdl = "6.7.1"
indexmap = { version = "2.14.2", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
postcard = { version = "1.1.3", features = ["alloc"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
dioxus = { version = "0.7.10", features = ["web"] }
gloo-net = { version = "0.7", features = ["websocket"] }
toml = "1.1"
futures-util = "0.3"
tracing = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
