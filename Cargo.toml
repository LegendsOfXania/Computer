[workspace]
resolver = "2"
members = [
    "crates/computer",
    "crates/computer-edk",
    "crates/computer-edk-macro",
    "crates/computer-model",
    "crates/computer-panel",
]
exclude = ["extension/dev-extension"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
authors = ["Legends of Xania"]

[workspace.dependencies]
computer = { path = "crates/computer" }
computer-edk = { path = "crates/computer-edk" }
computer-edk-macro = { path = "crates/computer-edk-macro" }
computer-model = { path = "crates/computer-model" }
computer-panel = { path = "crates/computer-panel" }

pumpkin-plugin-api = "0.2.1"
tracing = "0.1"

arc-swap = "1.9.5"
parking_lot = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = "0.4.46"
hex = "0.4.3"
sha2 = "0.11.1"
base64 = "0.23.1"
postcard = { version = "1.1.3", features = ["alloc"] }
flate2 = { version = "1.1.11", default-features = false, features = [
    "rust_backend",
] }
indexmap = { version = "2.14.2", features = ["serde"] }
toml = "1.2.1"
getrandom = { version = "0.4.3", features = ["wasm_js"] }
uuid = { version = "1.29.0", features = ["serde"] }

dioxus = { version = "0.7.10", features = ["web"] }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", version = "0.0.1", default-features = false }
dioxus-flow = "0.1.3"
dioxus-i18n = "0.6.0"
js-sys = "0.3.107"

gloo-net = { version = "0.7.0", features = ["websocket"] }
gloo-timers = { version = "0.4.0", features = ["futures"] }
waki = "0.5.1"
httparse = "1.10.1"
tungstenite = { version = "0.30.0", default-features = false, features = [
    "handshake",
] }

proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.10", features = ["full"] }

futures-util = "0.3.34"
futures-channel = "0.3.34"

frizbee = { version = "0.13.0", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
