[workspace]
resolver = "2"
members = [
    "crates/computer-model",
    "crates/computer-panel",
    "crates/computer-plugin",
    "crates/mock-engine",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
authors = ["Legends of Xania"]

[workspace.dependencies]
computer-model = { path = "crates/computer-model" }
computer-panel = { path = "crates/computer-panel" }
computer-plugin = { path = "crates/computer-plugin" }

pumpkin-plugin-api = { git = "https://github.com/Pumpkin-MC/Pumpkin", tag = "0.2.0+26.3-26.51" }
tracing = "0.1"

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tar = "0.4.46"
sha1 = "0.11.0"
base64 = "0.23.1"
postcard = { version = "1.1.3", features = ["alloc"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
indexmap = { version = "2.14.2", features = ["serde"] }
toml = "1.1"

dioxus = { version = "0.7.10", features = ["web"] }
dioxus-flow = "0.1.3"

gloo-net = { version = "0.7.0", features = ["websocket"] }
waki = "0.5.1"
httparse = "1.10.1"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

futures-util = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
