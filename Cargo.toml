[workspace]
resolver = "2"
members = [
    "crates/computer-model",
    "crates/computer-panel",
    "crates/computer-plugin",
    "crates/mock-engine",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
authors = ["Legends of Xania"]

[workspace.dependencies]
# Internal
computer-model = { path = "crates/computer-model" }
computer-panel = { path = "crates/computer-panel" }
computer-plugin = { path = "crates/computer-plugin" }

# Pumpkin
pumpkin-plugin-api = { git = "https://github.com/Pumpkin-MC/Pumpkin", tag = "0.2.0+26.3-26.51" }
tracing = "0.1"

# Serialization & data
serde = { version = "1.0.229", features = ["derive"] }
postcard = { version = "1.1.3", features = ["alloc"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
indexmap = { version = "2.14.2", features = ["serde"] }

# Configuration & parsing
kdl = "6.7.1"
toml = "1.1"

# Panel
dioxus = { version = "0.7.10", features = ["web"] }
gloo-net = { version = "0.7", features = ["websocket"] }
dioxus-flow = "0.1.3"

# Async
futures-util = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
